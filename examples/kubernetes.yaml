# treesync on Kubernetes: one Deployment mirroring one volume into another.
#
#   kubectl apply -f kubernetes.yaml
#   kubectl -n treesync logs -f deploy/treesync
#
# The PersistentVolumes here use `hostPath`, which is the one backend that works
# on any cluster without configuration. It is fine for a single-node cluster or
# a local kind/minikube, and wrong for anything real: a hostPath volume is tied
# to whichever node the pod landed on. For a real cluster, delete both
# PersistentVolume objects and give the claims a `storageClassName` instead.
---
apiVersion: v1
kind: Namespace
metadata:
  name: treesync
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: treesync-config
  namespace: treesync
data:
  # Mounted at /etc/treesync, which is where the CLI looks by default, so the
  # container needs no --config flag. The file has to be named config.toml.
  config.toml: |
    [[sync]]
    name = "app"
    source = "/data/src"

    # Batched changes. Longer batches more work into one pass; shorter reduces
    # lag. One second suits a tree under steady change.
    delay = "1s"

    # Off by default, and left off here. The target is usually the copy without
    # a backup, and a source that is briefly unreadable is hard to tell apart
    # from one whose files were really deleted. Turn it on deliberately.
    delete = false

    exclude = ["*.tmp", ".git/"]

      [sync.target]
      type = "local"
      path = "/data/dst"
---
# The watched tree.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: treesync-src
spec:
  capacity:
    storage: 10Gi
  accessModes:
    # ReadWriteOnce because a hostPath volume is one node's disk. If the source
    # is written by another pod, that pod and treesync have to be scheduled to
    # the same node, or the volume needs a backend that supports ReadWriteMany.
    - ReadWriteOnce
  # Retain, so deleting the claim does not delete the data. Delete would be a
  # surprising default for the tree being mirrored.
  persistentVolumeReclaimPolicy: Retain
  storageClassName: treesync-hostpath
  hostPath:
    path: /srv/treesync/src
    type: DirectoryOrCreate
---
# The mirror.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: treesync-dst
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: treesync-hostpath
  hostPath:
    path: /srv/treesync/dst
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: treesync-src
  namespace: treesync
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: treesync-hostpath
  resources:
    requests:
      storage: 10Gi
  # Named explicitly so the claim binds to the volume above rather than to
  # whatever else the class happens to offer.
  volumeName: treesync-src
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: treesync-dst
  namespace: treesync
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: treesync-hostpath
  resources:
    requests:
      storage: 10Gi
  volumeName: treesync-dst
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: treesync
  namespace: treesync
  labels:
    app.kubernetes.io/name: treesync
spec:
  # One. Two replicas would mirror the same source into the same target
  # concurrently, and with ReadWriteOnce claims the second pod would not
  # schedule anyway. Raising this is not a way to go faster.
  replicas: 1

  strategy:
    # Recreate, not RollingUpdate. A rolling update would briefly run two
    # daemons against one target, and the ReadWriteOnce claim would leave the
    # new pod stuck Pending until the old one released it.
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: treesync

  template:
    metadata:
      labels:
        app.kubernetes.io/name: treesync
      annotations:
        # Rolls the pod when the config changes. Without this, editing the
        # ConfigMap updates the file on disk but nothing rereads it.
        checksum/config: replace-me-or-use-a-templating-tool
    spec:
      # Enough for the shutdown flush. treesync applies what it has already
      # observed on SIGTERM; a shorter period turns that into a SIGKILL partway
      # through writing a file.
      terminationGracePeriodSeconds: 30

      securityContext:
        # The image runs fine unprivileged. `preserve.ownership` is off by
        # default, which is what makes that possible: chown needs privilege, and
        # an unprivileged run with it on would report a failure per file.
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # Note that this does nothing for the volumes below. kubelet applies
        # fsGroup only to volume types that support ownership management, and
        # hostPath is not one of them. It is set because it becomes the right
        # thing the moment these claims are backed by a real storageClass, at
        # which point the init container can go.
        fsGroup: 65532

      initContainers:
        # Makes the target writable by the unprivileged user above.
        #
        # A `DirectoryOrCreate` hostPath is created root-owned and 0755. The
        # source is only read, so that is fine for it, but the local sink builds
        # each file in a temporary *inside* the destination directory before
        # renaming it into place. Without this, uid 65532 cannot create that
        # temporary and the very first transfer fails with permission denied,
        # after the manifest has applied cleanly and the pod has started.
        #
        # This exists because the example uses hostPath. The alternatives are to
        # pre-create and chown the directories on the node, or to use a
        # storageClass whose plugin honours fsGroup, which is what a real
        # cluster should do.
        - name: prepare-target
          image: busybox:1.36
          # Ownership only, no chmod. `DirectoryOrCreate` makes the directory
          # 0755, so once it belongs to 65532 that user already has write. A
          # chmod would also need CAP_FOWNER, because after the chown root no
          # longer owns the path, and with capabilities dropped it fails with
          # EPERM: the init container exits non-zero and the pod never starts.
          command:
            - sh
            - -c
            - chown 65532:65532 /data/dst
          securityContext:
            # Overrides the pod-level `runAsNonRoot`, which would otherwise stop
            # this container from starting. It runs one chown and exits.
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              # The one capability a chown needs.
              add: ["CHOWN"]
          volumeMounts:
            - name: dst
              mountPath: /data/dst
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi

      containers:
        - name: treesync
          image: ghcr.io/anthid-labs/treesync:latest

          # The image has no default command on purpose: `sync` would mutate the
          # target the moment the container started.
          args: ["watch"]

          env:
            - name: LOG_LEVEL
              value: info

          volumeMounts:
            - name: config
              mountPath: /etc/treesync
              readOnly: true
            - name: src
              mountPath: /data/src
              # treesync never writes to its source. Making that the kernel's
              # guarantee rather than a promise costs nothing.
              readOnly: true
            - name: dst
              mountPath: /data/dst

          # `check` validates the config without touching either tree, so it is
          # safe against a live daemon and catches a ConfigMap edited into an
          # invalid state.
          livenessProbe:
            exec:
              command: ["treesync", "check"]
            initialDelaySeconds: 10
            periodSeconds: 60
            timeoutSeconds: 10

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              # Transfers stream, so memory does not scale with the size of the
              # largest file. It scales with the number of entries in the index,
              # so raise this for a tree with very many files, not for a tree
              # with very large ones.
              memory: 256Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

      volumes:
        - name: config
          configMap:
            name: treesync-config
        - name: src
          persistentVolumeClaim:
            claimName: treesync-src
        - name: dst
          persistentVolumeClaim:
            claimName: treesync-dst

        # To mirror to another host instead, drop the dst claim, point the
        # target at ssh in the ConfigMap, and mount a key:
        #
        #   - name: ssh
        #     secret:
        #       secretName: treesync-ssh
        #       defaultMode: 0400
        #
        # with a matching mount at /etc/treesync/ssh. OpenSSH refuses a key that
        # is group or world readable, so the mode matters.
