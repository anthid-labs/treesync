[package]
name = "treesync-cli"
description = "Command line interface for treesync: watches directories and mirrors them, locally or over SSH."
keywords = ["sync", "mirror", "rsync", "lsyncd", "cli"]
categories = ["command-line-utilities", "filesystem"]
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

# The package is `treesync-cli` so it can be published alongside the `treesync`
# library, but the command it installs is `treesync`. That is the name in every
# config example, and the name the agent is started under on a remote host.
[[bin]]
name = "treesync"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
treesync = { workspace = true }

clap = { workspace = true }
dotenvy = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
futures = { workspace = true }
tempfile = { workspace = true }
filetime = { workspace = true }
treesync = { workspace = true }
