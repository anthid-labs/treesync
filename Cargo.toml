[workspace]
resolver = "2"

# Members are globbed: dropping a crate into apps/ or crates/ picks it up with
# no edit here. The glob's parent directory has to exist, since cargo treats an
# unmatched glob as a literal path and fails to read it.
members = [
    "apps/*",
    "crates/*",
]

[workspace.package]
version = "0.1.18"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/anthid-labs/treesync"
homepage = "https://github.com/anthid-labs/treesync"
authors = ["Dallin Wright <dallinwright@anthid.com>"]
# Stated rather than inferred, so a build on an older toolchain fails with the
# version it needs instead of an error inside a dependency. Edition 2024 puts
# the floor at 1.85; `u32::is_multiple_of` in `remote::ssh` raises it to 1.87.
# `cargo clippy` enforces this, so it cannot drift from what the code uses.
rust-version = "1.87"

[profile.release]
opt-level = 3

[profile.dev]
opt-level = 0

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(coverage)',
    'cfg(coverage_nightly)',
] }

[workspace.dependencies]
# Local crates. Add one line per crate created under crates/, then depend on
# it from an app with `<name> = { workspace = true }`.
#
# `version` alongside `path` is what makes publishing work: cargo builds against
# the path locally and rewrites the dependency to the version on crates.io when
# it packages. Without it, `cargo publish` refuses the crate.
#
# Keep `version` in step with `[workspace.package]` above on every bump. Cargo
# cannot inherit it here, and a stale value is not a build error: `0.1.0` reads
# as `^0.1.0`, so a published `treesync-cli 0.1.1` would happily resolve against
# the older `treesync 0.1.0` on crates.io rather than the library it shipped
# with.
treesync = { path = "crates/treesync", version = "0.1.18" }

# Async runtime
tokio = { version = "1.53", features = ["full"] }
tokio-util = { version = "0.7" }
futures = "0.3"
async-trait = "0.1"

# Filesystem watching / traversal
notify = "8.2"
walkdir = "2.5"
globset = "0.4"
tempfile = "3.27"
filetime = "0.2"

# CLI and configuration
clap = { version = "4.6", features = ["derive", "env"] }
dotenvy = "0.15"

# Serialization
serde = { version = "1", features = ["derive"] }
toml = "0.9"
humantime-serde = "1.1"
# The remote agent's wire format. Compact and self-delimiting, which a
# hand-rolled codec would have to reimplement; deliberately not a gRPC stack,
# since the transport is one SSH pipe and there is nothing to route.
bincode = { version = "2", default-features = false, features = ["std", "serde"] }

# Errors
thiserror = "2"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Hashing
blake3 = "1.8"

# Compression for the remote protocol's frames. zstd rather than zlib for the
# ratio at a given speed on the payload that matters, file content and index
# frames, and it builds static against musl for the Alpine image.
zstd = "0.13"

# Telemetry
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "env-filter", "std", "ansi"] }
