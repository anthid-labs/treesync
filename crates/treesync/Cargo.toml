[package]
name = "treesync"
description = "One-way directory mirroring: watch a tree and mirror it locally or to a host over SSH, sending only what changed."
keywords = ["sync", "mirror", "rsync", "inotify", "delta"]
categories = ["filesystem", "network-programming", "asynchronous"]
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "treesync"
path = "src/lib.rs"

[lints]
workspace = true

# Builds every feature on docs.rs, so the documentation matches the crate rather
# than its default build.
[package.metadata.docs.rs]
all-features = true

[dependencies]
tokio = { workspace = true }
tokio-util = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
notify = { workspace = true }
walkdir = { workspace = true }
globset = { workspace = true }
blake3 = { workspace = true }
zstd = { workspace = true }
filetime = { workspace = true }
async-trait = { workspace = true }
humantime-serde = { workspace = true }
toml = { workspace = true }
serde = { workspace = true }
bincode = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
futures = { workspace = true }
tempfile = { workspace = true }
filetime = { workspace = true }
