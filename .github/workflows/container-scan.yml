name: "🛡️ Container image scan"

# Scans an image that is already in GHCR, so it runs against the exact artifact
# that will be deployed and published rather than a rebuild of it.
#
# Report only. Findings are published to the run summary and kept as an
# artifact, and none of them fail this workflow or hold up a publish. The
# caller reflects that by not making this job a dependency of the manifest
# push, so the two run side by side.
#
# The scanner failing is still a failure. That is the scan not having happened,
# which is worth seeing, and is a different thing from the scan finding
# something.
on:
  workflow_call:
    inputs:
      image_repository:
        description: "Container image repository"
        required: true
        type: string

      image_tag:
        description: "Container image tag"
        required: true
        type: string

      severity:
        description: "Severities to report"
        required: false
        type: string
        default: "HIGH,CRITICAL"

      ignore_unfixed:
        description: "Skip vulnerabilities with no released fix"
        required: false
        type: boolean
        default: true

      scanners:
        description: "Trivy scanners to run (vuln, secret, misconfig, license)"
        required: false
        type: string
        default: "vuln"

  # Mirrors the workflow_call inputs so `inputs.*` resolves the same way on a
  # manual run, which is how an already-published tag gets re-scanned when a
  # new advisory lands without any code change.
  workflow_dispatch:
    inputs:
      image_repository:
        description: "Container image repository"
        required: true
        type: string

      image_tag:
        description: "Container image tag"
        required: true
        type: string

      severity:
        description: "Severities to report"
        required: false
        type: string
        default: "HIGH,CRITICAL"

      ignore_unfixed:
        description: "Skip vulnerabilities with no released fix"
        required: false
        type: boolean
        default: true

      scanners:
        description: "Trivy scanners to run (vuln, secret, misconfig, license)"
        required: false
        type: string
        default: "vuln"

permissions:
  contents: read
  packages: read

jobs:
  trivy:
    name: Trivy

    runs-on: ubuntu-latest

    env:
      IMAGE_REF: ${{ inputs.image_repository }}:${{ inputs.image_tag }}

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan image
        id: scan
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          # Trivy pulls the image itself rather than through the Docker daemon,
          # so it needs the registry credentials directly. The built-in token
          # is enough here because the image being scanned belongs to this
          # repository.
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          # Silence the "a newer Trivy is available" notice: the scanner is
          # pinned below, so an upgrade is a deliberate bump in this file
          # rather than something to be told about on every run.
          TRIVY_SKIP_VERSION_CHECK: "true"
        with:
          image-ref: ${{ env.IMAGE_REF }}
          # The action's bundled default trails the Trivy release by several
          # versions, so pin the scanner here and bump it deliberately.
          version: v0.74.0
          scan-type: image
          scanners: ${{ inputs.scanners }}
          severity: ${{ inputs.severity }}
          # Leaves out vulnerabilities with no released fix, since there is no
          # action to take on one beyond waiting for the base image to carry a
          # patch. Set `ignore_unfixed: false` to have them in the report too,
          # which now costs nothing but noise: nothing here gates on findings.
          ignore-unfixed: ${{ inputs.ignore_unfixed }}
          format: table
          output: trivy-report.txt
          # Report only. A non-zero code here would fail the step, the job, and
          # every caller waiting on it, which is what used to hold a release
          # behind a CVE in a base image that had no patch yet. The findings
          # still land in the summary and the artifact below.
          exit-code: "0"

      - name: Publish report
        if: always()
        run: |
          set -euo pipefail

          # Trivy writes the table only when it has something to put in it, so
          # an empty or missing file is the clean result rather than a failure
          # to produce one. Unless the scanner itself fell over, in which case
          # the same empty file means nothing was looked at, and reporting that
          # as "no findings" would be the one genuinely dangerous thing this
          # step could say.
          if [[ "${{ steps.scan.outcome }}" != "success" ]]; then
            headline="the scan did not complete, so nothing was checked"
          elif [[ -s trivy-report.txt ]]; then
            headline="findings at \`${{ inputs.severity }}\`, reported and not gated"
          else
            headline="no findings at \`${{ inputs.severity }}\`"
          fi

          {
            echo "### Container scan: \`$IMAGE_REF\`"
            echo
            echo "$headline"
            echo
            echo "This scan is **report only**. It does not fail the build or"
            echo "hold up a publish."
            echo
            echo '```'
            if [[ -s trivy-report.txt ]]; then
              cat trivy-report.txt
            elif [[ "${{ steps.scan.outcome }}" != "success" ]]; then
              echo "See the failed step above."
            else
              echo "Nothing to report."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report-${{ inputs.image_tag }}
          path: trivy-report.txt
          if-no-files-found: warn
          retention-days: 30
